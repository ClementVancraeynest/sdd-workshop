# Group 4: every pull request that touches group-4/ runs the app's tests and lint, so the
# pull request shows green or red for this group only: a group that is behind never turns
# another's red. When a pull request that touches group-4/app/ is merged into main, the
# tests run again and, green, the app is published on the workshop's site, at
# https://<owner>.github.io/<repo>/group-4/ (.github/pages/publish.sh). A red test
# publishes nothing: the site keeps the last green app.
name: group 4
on:
  pull_request:
    paths:
      - group-4/**
  push:
    branches: [main]
    paths:
      - group-4/app/**
      - .github/workflows/group-4.yml
      - .github/pages/publish.sh
      - .github/pages/test.sh
  workflow_dispatch:
permissions:
  contents: write
# One queue per group and kind of event: two merges of the same group publish one after the
# other. Two groups at once both publish: publish.sh tries again on top of the other's site.
concurrency:
  group: site-group-4-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The app's tests and lint
        run: sh .github/pages/test.sh group-4
      - name: Publish group-4 on the site
        if: github.event_name != 'pull_request'
        run: sh .github/pages/publish.sh group-4
