<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>basket</title></head>
<body>
<script src="check.js"></script>
<script src="../basket.js"></script>
<script>
var a = Basket.create();
Basket.add(a, { name: "Shirt", priceCents: 2000 }, 1);
Basket.add(a, { name: "Cap", priceCents: 1550 }, 1);
check("1 add products: 20.00 and 15.50 total 3550", Basket.total(a), 3550);

var b = Basket.create();
Basket.add(b, { name: "Shirt", priceCents: 2000 }, 1);
Basket.add(b, { name: "Shirt", priceCents: 2000 }, 1);
check("2 same product twice: one line of quantity 2, total 4000",
  { lines: b.lines.length, quantity: b.lines[0].quantity, total: Basket.total(b) },
  { lines: 1, quantity: 2, total: 4000 });

check("3 no VAT line: only lines in the basket, a number as total",
  { keys: Object.keys(a), total: typeof Basket.total(a) },
  { keys: ["lines"], total: "number" });

var c = Basket.create();
Basket.add(c, { name: "Jacket", priceCents: 2000, stickerPercent: 30 }, 1);
check("4 sticker: 20.00 at 30 % has line price 1400 and total 1400",
  { price: c.lines[0].priceCents, total: Basket.total(c) },
  { price: 1400, total: 1400 });

var d = Basket.create();
Basket.add(d, { name: "Scarf", priceCents: 1999, stickerPercent: 30 }, 1);
check("5 rounding down: 19.99 at 30 % has line price 1399", d.lines[0].priceCents, 1399);
</script>
</body>
</html>
